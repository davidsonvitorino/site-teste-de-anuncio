<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Encontre profissionais locais perto de você. Anúncios de eletricista, salão, mecânica, pedreiro e mais serviços">
    <meta name="keywords" content="anúncios locais, profissionais, serviços, eletricista, salão, mecânica, pedreiro">
    <meta name="author" content="Site de Anúncios Locais">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    
    <title>Anúncios Locais - Encontre Profissionais Perto de Você</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Cabeçalho do site -->
    <header>
        <h1>Anúncios da Cidade</h1>
        <p>Encontre profissionais perto de você</p>
    </header>

    <!-- Seção de chamada para anunciantes -->
    <section class="cta">
        <h2>Quer anunciar seu serviço?</h2>
        <p>Entre em contato e apareça para novos clientes</p>

        <a class="whatsapp" href="https://wa.me/5531999999999">
            Anuncie aqui
        </a>

        <section class="filtros">
            <button onclick="filtrarCategoria('Todos')">Todos</button>
            <button onclick="filtrarCategoria('Eletricista')">Eletricista</button>
            <button onclick="filtrarCategoria('Salão')">Salão</button>
            <button onclick="filtrarCategoria('Mecânica')">Mecânica</button>
            <button onclick="filtrarCategoria('Pedreiro')">Pedreiro</button>
        </section>

        <button id="btn-meus">Meus anúncios</button>
        <button id="btn-todos">Todos</button>

        <!-- Lista de anúncios -->
         <main>
            <!-- Anúncios dinâmicos entram aqui -->
         </main>
    </section>

    <!-- Campo de busca -->
    <section class="busca">
        <input type="text" id="campo-busca" placeholder="Buscar serviços...">
    </section>

    <section class="login">
        <h2 class="login-titulo">Login</h2>

        <input type="email" id="email" name="email" placeholder="Email" autocomplete="email">
        <input type="password" id="senha" name="senha" placeholder="Senha" autocomplete="new-password">

        <button id="btn-login">Entrar</button>
        <button id="btn-cadastro">Cadastrar</button>
    </section>

    
    <p id="usuario-logado"></p>

    <section class="formulario">

        <!-- Formulário de cadastro -->
        <form id="form-anuncio">

            <h2>Cadastro de Anúncio</h2>
            <input type="text" name="servico" id="nome" placeholder="Nome do serviço" required>

            <input type="text" id="descricao" placeholder="Descrição do serviço">

            <input type="text" id="whatsapp" placeholder="Whatsapp (DDD + número)" required>

            <select id="categoria" required>
                <option class="btn-filtro" value="">Selecione uma categoria</option>
                <option class="btn-filtro" value="Eletricista">Eletricista</option>
                <option class="btn-filtro" value="Salão">Salão</option>
                <option class="btn-filtro" value="Mecânica">Mecânica</option>
                <option class="btn-filtro" value="Pedreiro">Pedreiro</option>
                <option class="btn-filtro" value="Outros">Outros</option>
            </select>

            <input type="file" id="imagem" accept="image/*">

            <button type="submit">Enviar</button>
            <button id="btn-logout" style="display: none;">Sair</button>
        </form>

        <button id="limpar-tudo">Limpar todos os anúncios</button>
    </section>

    <script type="module" src="script.js"></script>

    <!-- Footer com políticas legais -->
    <footer style="background: #333; color: white; text-align: center; padding: 15px; margin-top: 30px;">
        <p style="margin: 0;">
            <a href="politica-privacidade.html" style="color: #25d366; text-decoration: none; margin: 0 10px;">Política de Privacidade</a>
            |
            <a href="termos-servico.html" style="color: #25d366; text-decoration: none; margin: 0 10px;">Termos de Serviço</a>
        </p>
        <p style="margin: 10px 0; font-size: 12px;">© 2026 Anúncios Locais. Todos os direitos reservados.</p>
    </footer>
    <div id="mensagem" class="mensagem"></div>
</body>
</html>
